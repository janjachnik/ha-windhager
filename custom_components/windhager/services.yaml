set_current_temp_compensation:
  target:
    entity:
      integration: windhager
      domain: climate
  fields:
    compensation:
      required: true
      selector:
        number:
          min: -3.5
          max: 3.5
          step: 0.1
          unit_of_measurement: "K"

boost_hot_water:
  target:
    entity:
      integration: windhager
      domain: water_heater
  fields:
    temperature:
      required: false
      selector:
        number:
          min: 10.0
          max: 75.0
          step: 0.5
          unit_of_measurement: "°C"

cancel_hot_water_boost:
  target:
    entity:
      integration: windhager
      domain: water_heater

